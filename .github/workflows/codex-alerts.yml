name: Codex Reset Alerts

on:
  schedule:
    # UTC minutes 03, 13, 23, 33, 43, 53: avoid the busy top of the hour.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: API 미리보기 / test: 연결 테스트 1건 전송 / send: 운영 / demo: 가상 미리보기'
        type: choice
        options: [preview, test, send, demo]
        default: preview

permissions:
  contents: write

concurrency:
  group: codex-reset-alerts
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: codex-reset-discord
    env:
      PYTHONUTF8: '1'
      MODE: ${{ inputs.mode || 'send' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test classification and delivery state
        run: python -m unittest discover -v
      - name: Run one check
        id: check
        shell: bash
        run: |
          case "$MODE" in
            send) python monitor.py --send ;;
            demo) python monitor.py --demo ;;
            preview) python monitor.py ;;
            test) python monitor.py --test-webhook ;;
            *) exit 1 ;;
          esac
      - name: Persist successful delivery checkpoints
        # Save even when a later Discord send failed, to retain earlier receipts.
        if: ${{ always() && env.MODE == 'send' && steps.check.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ ! -f state/state.json ] && [ ! -f state/cooldown.json ]; then exit 0; fi
          git add -- state/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: save Codex alert delivery state'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
